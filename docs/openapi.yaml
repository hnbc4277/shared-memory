openapi: 3.0.3
info:
  title: Shared Memory API
  version: 0.1.0
  description: Self-hosted evidence, recall, agents, vault, artifacts, KB. Auth Bearer API Key or Cookie wss_ session.
servers:
  - url: http://127.0.0.1:18080
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
  /v1/auth/register:
    post:
      summary: Register account (returns api_key + Set-Cookie sm_session)
      responses:
        "201":
          description: Created
  /v1/auth/login:
    post:
      summary: Email login (Cookie + token)
      responses:
        "200":
          description: OK
  /v1/me:
    get:
      summary: Current account
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
  /v1/ingest:
    post:
      summary: Ingest message
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "201":
          description: Created
  /v1/recall:
    post:
      summary: Recall context
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
  /v1/sessions:
    get:
      summary: List sessions
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
  /v1/sessions/{id}:
    get:
      summary: Session detail with tool_calls
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
  /v1/agents:
    get:
      summary: Agent connection groups
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
  /v1/agents/connections:
    post:
      summary: Create connection
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "201":
          description: Created
  /v1/agents/connections/heartbeat:
    post:
      summary: Connection process heartbeat (updates last_heartbeat_at)
      description: |
        Auth Bearer API Key or Cookie. connection_id from dedicated key binding, or body/query for account keys.
        Optional body client/version for audit only. Throttled to one DB update per connection per 5s (still 204).
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: connection_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                connection_id: { type: string, format: uuid }
                client:
                  type: string
                  description: setup, mcp, adapter, daemon, etc.
                version: { type: string }
      responses:
        "204":
          description: Accepted (timestamp updated or throttled within 5s)
        "400":
          description: connection_id required or invalid
        "403":
          description: connection_id does not match API key
        "404":
          description: connection not found or revoked
  /v1/vault/items:
    get:
      summary: List vault items
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
  /v1/artifacts:
    get:
      summary: List artifacts
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
  /v1/kb/documents:
    post:
      summary: Upload KB document (multipart)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "201":
          description: Created
  /v1/ws:
    get:
      summary: WebSocket ingest/recall (Bearer, Cookie, or auth message)
      responses:
        "101":
          description: Switching Protocols
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: sm_session
